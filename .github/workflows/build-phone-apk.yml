name: BaykusNot V20.28 APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36.1
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Unpack BaykusNot
        run: |
          unzip -q BaykusNot_V20_28_GITHUB_PHONE_BUILD_READY.zip -d unpacked
          test -f unpacked/BaykusNot_V20_28_GITHUB_PHONE_BUILD_READY/gradlew

      - name: Patch Gradle Kotlin DSL
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("unpacked/BaykusNot_V20_28_GITHUB_PHONE_BUILD_READY/app/build.gradle.kts")
          s = p.read_text(encoding="utf-8")

          imports = """import java.net.URI
          import java.security.KeyFactory
          import java.security.MessageDigest
          import java.security.Signature
          import java.security.spec.X509EncodedKeySpec
          import java.util.Base64

          """

          if "import java.net.URI" not in s:
              s = imports + s

          replacements = {
              "java.security.MessageDigest": "MessageDigest",
              "java.net.URI": "URI",
              "java.security.KeyFactory": "KeyFactory",
              "java.security.spec.X509EncodedKeySpec": "X509EncodedKeySpec",
              "java.security.Signature": "Signature",
              "java.util.Base64": "Base64",
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Build APK
        working-directory: unpacked/BaykusNot_V20_28_GITHUB_PHONE_BUILD_READY
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Prepare APK
        run: |
          cp unpacked/BaykusNot_V20_28_GITHUB_PHONE_BUILD_READY/app/build/outputs/apk/debug/app-debug.apk BaykusNot-V20.28-TELEFONA-KUR.apk
          sha256sum BaykusNot-V20.28-TELEFONA-KUR.apk > BaykusNot-V20.28-TELEFONA-KUR.apk.sha256.txt
          unzip -t BaykusNot-V20.28-TELEFONA-KUR.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaykusNot-V20.28-TELEFONA-KUR
          path: |
            BaykusNot-V20.28-TELEFONA-KUR.apk
            BaykusNot-V20.28-TELEFONA-KUR.apk.sha256.txt

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v20.28-phone-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            BaykusNot-V20.28-TELEFONA-KUR.apk \
            BaykusNot-V20.28-TELEFONA-KUR.apk.sha256.txt \
            --target "$GITHUB_SHA" \
            --title "BaykusNot V20.28 - Telefona Kur" \
            --notes "BaykusNot V20.28 kurulabilir Android test APK."
