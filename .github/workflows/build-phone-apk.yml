name: BaykusNot V20.29 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"

      - name: Unpack source
        run: |
          rm -rf unpacked
          mkdir unpacked
          unzip -q BaykusNot_V20_29_REAL_ANDROID_BUILD_HARDENED_SOURCE.zip -d unpacked
          PROJECT_DIR="$(dirname "$(find unpacked -type f -name gradlew -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean :app:assembleDebug

      - name: Prepare APK
        run: |
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" BaykusNot-V20.29-TELEFONA-KUR.apk
          sha256sum BaykusNot-V20.29-TELEFONA-KUR.apk > BaykusNot-V20.29-TELEFONA-KUR.apk.sha256.txt
          unzip -t BaykusNot-V20.29-TELEFONA-KUR.apk >/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaykusNot-V20.29-TELEFONA-KUR
          path: |
            BaykusNot-V20.29-TELEFONA-KUR.apk
            BaykusNot-V20.29-TELEFONA-KUR.apk.sha256.txt

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v20.29-phone-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            BaykusNot-V20.29-TELEFONA-KUR.apk \
            BaykusNot-V20.29-TELEFONA-KUR.apk.sha256.txt \
            --target "$GITHUB_SHA" \
            --title "BaykusNot V20.29 - Telefona Kur" \
            --notes "BaykusNot V20.29 kurulabilir Android debug APK."
